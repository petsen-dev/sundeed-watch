# Sundeed Watch — keyword sets
#
# These define RETRIEVAL, not filtering. Nothing here removes an item from the
# report; these are the queries used to pull material in. Everything fetched is
# translated, ranked and delivered.
#
# Taxonomy categories used by the classifier:
#   REGULATORY       taxes, licences, rental rules, ownership restrictions
#   OWNERSHIP-MODEL  fractional, co-ownership, swaps, rent-to-own
#   UPFUNNEL         who else moves into "rules and costs" before the listing
#   DEMAND-FLOW      cross-border buyer volumes and corridors
#   COMMISSION-MODEL splits, buyer agency, referral fees
#   CHANNEL          AI assistants, search, distribution
#   HEADLINE-GAP     announced vs actually enacted

# ---------------------------------------------------------------------------
# ENGLISH
# ---------------------------------------------------------------------------
en:
  locale: { hl: en-GB, gl: GB, ceid: "GB:en" }
  extra_locales:
    - { hl: en-US, gl: US, ceid: "US:en" }

  REGULATORY:
    - "Spain non-resident property tax"
    - "Spain transfer tax ITP change"
    - "Portugal IMT IMI change"
    - "foreign buyer property restrictions Europe"
    - "second home council tax premium"
    - "short-term rental licence ban"
    - "golden visa real estate threshold"
    - "empty homes tax"
    - "non-resident buyer surcharge"
    - "tourist rental permit suspension"

  OWNERSHIP-MODEL:
    - "fractional ownership second home"
    - "co-ownership holiday home platform"
    - "Pacaso"
    - "Prello OR Vivla OR MYNE OR Altacasa"
    - "August Collection co-ownership"
    - "second home swap exchange platform"
    - "shared ownership vacation property"
    - "timeshare alternative fractional"

  UPFUNNEL:
    - "property portal buyer tools launch"
    - "idealista new buyer feature"
    - "AI property search Europe"
    - "buying abroad guide launch platform"
    - "property cost calculator launch"

  DEMAND-FLOW:
    - "foreign buyers Spain property statistics"
    - "international buyers Portugal property"
    - "second home purchases abroad data"
    - "cross-border property buyers Europe"
    - "Gulf buyers European property"
    - "American buyers Italy Portugal property"
    - "expat property purchases coastal Spain"

  COMMISSION-MODEL:
    - "buyer agent commission"
    - "NAR settlement buyer agency"
    - "estate agency commission split"
    - "referral fee real estate regulation"
    - "buyer's agent Europe launch"

  CHANNEL:
    - "AI assistant real estate shopping"
    - "ChatGPT property search"
    - "proptech funding round second home"

  HEADLINE-GAP:
    - "property tax proposal not passed"
    - "housing bill stalled parliament Spain"
    - "real estate law delayed implementation"

# ---------------------------------------------------------------------------
# ARABIC  (العربية)
# ---------------------------------------------------------------------------
# Note on query design: raw "عقارات" returns overwhelmingly domestic Gulf and
# Egyptian market coverage. Terms below are corridor-shaped — they pair the
# buyer origin with the European destination — plus a set of broad terms so
# nothing is pre-excluded.
ar:
  locale: { hl: ar, gl: AE, ceid: "AE:ar" }
  extra_locales:
    - { hl: ar, gl: SA, ceid: "SA:ar" }
    - { hl: ar, gl: EG, ceid: "EG:ar" }

  REGULATORY:
    - "ضريبة العقارات في إسبانيا"        # property tax in Spain
    - "ضريبة نقل الملكية"                 # transfer tax
    - "تملك الأجانب للعقارات"             # foreign ownership of property
    - "قيود على المشترين الأجانب"          # restrictions on foreign buyers
    - "الإقامة الذهبية"                   # golden residency
    - "التأشيرة الذهبية العقارية"          # golden visa via real estate
    - "الإقامة عن طريق الاستثمار العقاري"  # residency by property investment
    - "تنظيم الإيجار قصير الأجل"           # short-term rental regulation
    - "حظر شراء العقارات للأجانب"          # ban on foreign property purchase

  OWNERSHIP-MODEL:
    - "الملكية الجزئية للعقارات"           # fractional property ownership
    - "التملك المشترك للمنازل"             # co-ownership of homes
    - "المشاركة في ملكية العقار"           # shared property ownership
    - "بديل التايم شير"                    # timeshare alternative

  UPFUNNEL:
    - "منصة عقارية أوروبية"                # European property platform
    - "دليل شراء عقار في أوروبا"           # guide to buying property in Europe
    - "حاسبة تكاليف شراء العقار"           # property cost calculator

  DEMAND-FLOW:
    - "المستثمرون الخليجيون في أوروبا"      # Gulf investors in Europe
    - "مستثمرون سعوديون عقارات أوروبا"      # Saudi investors European property
    - "مستثمرون إماراتيون عقارات أوروبا"    # Emirati investors European property
    - "المشترون العرب عقارات إسبانيا"       # Arab buyers Spanish property
    - "شراء عقار في الخارج"                # buying property abroad
    - "الاستثمار العقاري في أوروبا"         # real estate investment in Europe
    - "عقارات إسبانيا للأجانب"             # Spanish property for foreigners
    - "عقارات البرتغال للأجانب"            # Portuguese property for foreigners
    - "عقارات اليونان الإقامة"             # Greek property residency
    - "منزل ثانٍ في أوروبا"                # second home in Europe
    - "بيت العطلات في إسبانيا"             # holiday home in Spain
    - "شقق ماربيا"                        # Marbella apartments
    - "عقارات كوستا ديل سول"               # Costa del Sol property
    - "عقارات لشبونة"                     # Lisbon property

  COMMISSION-MODEL:
    - "عمولة الوسيط العقاري"               # real estate broker commission
    - "وسيط المشتري العقاري"               # buyer's agent
    - "الوساطة العقارية تنظيم"             # brokerage regulation

  CHANNEL:
    - "الذكاء الاصطناعي في العقارات"        # AI in real estate
    - "تقنية العقارات تمويل"               # proptech funding

  HEADLINE-GAP:
    - "مشروع قانون العقارات لم يُقر"        # property bill not passed
    - "تأجيل قانون العقارات"               # property law postponed

# ---------------------------------------------------------------------------
# SPANISH  — feeds the regulatory stream and Spanish trade press
# ---------------------------------------------------------------------------
es:
  locale: { hl: es-ES, gl: ES, ceid: "ES:es" }

  gazette_match:   # matched against BOE / BOJA / DOGV summary titles
    - "impuesto sobre transmisiones patrimoniales"
    - "ITP"
    - "actos jurídicos documentados"
    - "agente inmobiliario"
    - "registro de agentes"
    - "intermediación inmobiliaria"
    - "vivienda de uso turístico"
    - "alquiler turístico"
    - "ley de vivienda"
    - "no residentes"

  news:
    - "impuesto compra vivienda extranjeros"
    - "registro agentes inmobiliarios obligatorio"
    - "compraventa vivienda extranjeros no residentes"
    - "alquiler turístico normativa"
    - "personal shopper inmobiliario"

# ---------------------------------------------------------------------------
# PORTUGUESE
# ---------------------------------------------------------------------------
pt:
  locale: { hl: pt-PT, gl: PT, ceid: "PT:pt-150" }

  gazette_match:
    - "IMT"
    - "IMI"
    - "imposto municipal sobre as transmissões"
    - "mediação imobiliária"
    - "AMI"
    - "alojamento local"
    - "arrendamento de curta duração"

  news:
    - "compra de casa por estrangeiros Portugal"
    - "alojamento local licença"
    - "mediação imobiliária regulamentação"
    - "IMT alteração"
