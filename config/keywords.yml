# Sundeed Watch — keyword sets  (v2, operator-based)
#
# These define RETRIEVAL, not delivery. Everything fetched is still translated,
# ranked and delivered in full. What changed in v2 is precision at the source:
# instead of bag-of-words matching across the whole index, queries now use
# Google News operators.
#
# Operators available inside q=
#   "exact phrase"   locks wording — the single biggest noise reduction
#   intitle:x        x must be in the headline, not a passing mention
#   OR               capitalised, groups alternatives
#   -x               excludes x
#   site:domain      one publisher only
#   when:2d          last two days
#
# Craft notes:
#   - Quote the ENTITY, leave the rest loose. "golden visa" Spain beats
#     "Spain golden visa threshold" — few articles use the full phrase.
#   - intitle: on any term that appears casually everywhere (tax, property).
#   - Every Arabic query must name a European destination, or it returns Gulf
#     domestic coverage.
#
# Taxonomy: REGULATORY · OWNERSHIP-MODEL · UPFUNNEL · DEMAND-FLOW ·
#           COMMISSION-MODEL · CHANNEL · HEADLINE-GAP

# ---------------------------------------------------------------------------
# ENGLISH
# ---------------------------------------------------------------------------
en:
  locale: { hl: en-GB, gl: GB, ceid: "GB:en" }
  # Second locale disabled: en-US and en-GB return largely the same stories,
  # they collapse in dedupe anyway, and every extra request buys another 503.
  # Re-enable once Google stops throttling.
  extra_locales: []
  suffix: "when:2d"

  # Applied to the Al Arabiya English business feed, which arrives unfiltered.
  feed_match:
    - propert
    - real estate
    - housing
    - mortgage
    - golden visa
    - residency
    - spain
    - portugal
    - italy
    - greece
    - france
    - cyprus
    - europe

  REGULATORY:
    - '"non-resident" intitle:property Spain OR Portugal'
    - 'intitle:"transfer tax" Spain OR Portugal OR Italy'
    - '"ITP" OR "impuesto de transmisiones" Spain property'
    - '"IMT" OR "IMI" Portugal property tax'
    - 'intitle:"golden visa" Portugal OR Greece OR Spain OR Italy'
    - '"foreign buyer" intitle:ban OR intitle:restriction property'
    - '"second home" intitle:tax OR intitle:premium'
    - '"short-term rental" intitle:licence OR intitle:ban Spain OR Portugal'
    - '"tourist rental" intitle:permit Spain'
    - '"estate agent" intitle:register Spain OR Andalusia OR Valencia'

  OWNERSHIP-MODEL:
    - 'intitle:"fractional ownership" property'
    - '"co-ownership" "second home" OR "holiday home"'
    - 'intitle:Pacaso'
    - 'Prello OR Vivla OR MYNE OR Altacasa property'
    - '"second home" intitle:swap OR intitle:exchange platform'
    - 'timeshare alternative fractional -resort'

  UPFUNNEL:
    - 'idealista intitle:launch OR intitle:tool OR intitle:feature'
    - '"property portal" intitle:buyers'
    - '"AI" "property search" Europe intitle:launch'
    - '"buying abroad" intitle:guide OR intitle:platform property'
    - '"cost calculator" property Spain OR Portugal'

  DEMAND-FLOW:
    - '"foreign buyers" Spain property intitle:data OR intitle:figures OR intitle:rise'
    - '"international buyers" Portugal OR Italy property'
    - '"cross-border" property buyers Europe'
    - '"Gulf" OR "Middle East" buyers Spain OR Portugal OR Greece property'
    - '"American buyers" Italy OR Portugal OR Spain property'
    - '"second home" purchases abroad intitle:data OR intitle:survey'
    - '"non-resident purchases" Spain'

  COMMISSION-MODEL:
    - 'intitle:"buyer agent" commission'
    - '"NAR settlement" buyer agency commission'
    - '"commission split" estate agency'
    - '"referral fee" real estate intitle:rule OR intitle:regulation'
    - '"personal shopper" property Spain'

  PUBLISHER:
    - 'site:english.alarabiya.net property Spain OR Portugal OR Greece'
    - 'site:english.alarabiya.net "golden visa" OR "real estate" Europe'

  CHANNEL:
    - '"AI assistant" property search intitle:launch'
    - 'ChatGPT OR "AI agent" property buying'
    - 'proptech intitle:funding "second home" OR "holiday home"'

  HEADLINE-GAP:
    - 'Spain property tax intitle:scrapped OR intitle:dropped OR intitle:shelved'
    - 'housing bill intitle:stalled OR intitle:delayed Spain OR Portugal'
    - '"not debated" OR "never voted" property law Spain'

# ---------------------------------------------------------------------------
# ARABIC  (العربية)
# ---------------------------------------------------------------------------
# Rule applied throughout: every query names a European destination. Without
# it, Gulf and Egyptian domestic coverage swamps everything — the corridor is
# a rounding error in Arabic property news volume.
ar:
  locale: { hl: ar, gl: AE, ceid: "AE:ar" }
  extra_locales: []
  suffix: "when:2d"

  # Applied to the Al Arabiya أسواق feed, which arrives unfiltered. Broader
  # than the Google News queries on purpose: a whole-desk feed is small enough
  # that a wide net costs nothing, and any European place name is a strong
  # enough signal on an Arabic business wire.
  feed_match:
    - عقار
    - عقارات
    - إسبانيا
    - اسبانيا
    - البرتغال
    - اليونان
    - إيطاليا
    - ايطاليا
    - فرنسا
    - قبرص
    - أوروبا
    - اوروبا
    - الإقامة الذهبية
    - التأشيرة الذهبية
    - منزل ثان
    - بيت العطلات

  REGULATORY:
    - '"ضريبة العقارات" إسبانيا OR البرتغال'
    - '"تملك الأجانب" إسبانيا OR البرتغال OR اليونان'
    - '"الإقامة الذهبية" أوروبا OR البرتغال OR اليونان'
    - '"التأشيرة الذهبية" عقار أوروبا'
    - '"الإيجار قصير الأجل" إسبانيا OR البرتغال'
    - 'قيود شراء العقارات الأجانب أوروبا'

  OWNERSHIP-MODEL:
    - '"الملكية الجزئية" عقار أوروبا'
    - '"التملك المشترك" منزل أوروبا OR إسبانيا'

  UPFUNNEL:
    - '"منصة عقارية" أوروبا OR إسبانيا'
    - '"شراء عقار" دليل أوروبا'

  DEMAND-FLOW:
    - '"المستثمرون الخليجيون" أوروبا OR إسبانيا OR البرتغال'
    - 'مستثمرون سعوديون OR إماراتيون عقارات أوروبا'
    - '"المشترون العرب" عقارات إسبانيا OR البرتغال'
    - '"شراء عقار" إسبانيا OR البرتغال OR اليونان OR إيطاليا'
    - '"الاستثمار العقاري" أوروبا الخليج'
    - '"منزل ثانٍ" أوروبا'
    - 'عقارات ماربيا OR "كوستا ديل سول" OR لشبونة'
    - '"سوق العقارات" إسبانيا OR البرتغال'

  # Publishers that block direct polling, reached through Google instead.
  PUBLISHER:
    - 'site:alarabiya.net عقارات أوروبا OR إسبانيا OR البرتغال'
    - 'site:alarabiya.net "الإقامة الذهبية" OR "شراء عقار"'
    - 'site:aawsat.com عقارات أوروبا'

  COMMISSION-MODEL:
    - '"الوساطة العقارية" أوروبا OR إسبانيا'
    - '"عمولة الوسيط" عقار أوروبا'

  CHANNEL:
    - '"الذكاء الاصطناعي" عقارات أوروبا'

  HEADLINE-GAP:
    - 'قانون العقارات إسبانيا تأجيل OR إلغاء'

# ---------------------------------------------------------------------------
# SPANISH
# ---------------------------------------------------------------------------
es:
  locale: { hl: es-ES, gl: ES, ceid: "ES:es" }
  suffix: "when:2d"

  gazette_match:   # matched against BOE / BOJA summary titles, not a query
    - "impuesto sobre transmisiones patrimoniales"
    - "ITP"
    - "actos jurídicos documentados"
    - "agente inmobiliario"
    - "registro de agentes"
    - "intermediación inmobiliaria"
    - "vivienda de uso turístico"
    - "alquiler turístico"
    - "ley de vivienda"
    - "no residentes"

  news:
    - '"no residentes" intitle:vivienda OR intitle:impuesto'
    - 'intitle:ITP tipo Andalucía OR Valencia OR Baleares'
    - '"registro de agentes inmobiliarios" obligatorio'
    - '"vivienda de uso turístico" intitle:licencia OR intitle:moratoria'
    - '"compradores extranjeros" vivienda intitle:datos OR intitle:sube'
    - '"personal shopper inmobiliario"'

# ---------------------------------------------------------------------------
# PORTUGUESE
# ---------------------------------------------------------------------------
pt:
  locale: { hl: pt-PT, gl: PT, ceid: "PT:pt-150" }
  suffix: "when:2d"

  gazette_match:
    - "IMT"
    - "IMI"
    - "imposto municipal sobre as transmissões"
    - "mediação imobiliária"
    - "AMI"
    - "alojamento local"
    - "arrendamento de curta duração"

  news:
    - 'intitle:IMT OR intitle:IMI alteração imóveis'
    - '"alojamento local" intitle:licença OR intitle:suspensão'
    - '"mediação imobiliária" intitle:regulamentação OR intitle:AMI'
    - '"compradores estrangeiros" casa Portugal'
