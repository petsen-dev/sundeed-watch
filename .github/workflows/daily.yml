name: daily-report

on:
  schedule:
    # Three attempts, none on the hour. GitHub's schedule is best-effort:
    # top-of-hour slots contend hardest, delays of 5-30 minutes are routine,
    # and a saturated queue drops a run outright with no trace and no retry.
    # Whichever slot survives does the work; --once-daily makes the rest
    # no-ops, so a dropped slot costs nothing but a later delivery.
    - cron: '17 5 * * *'
    - cron: '23 7 * * *'
    - cron: '41 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        default: 'full'
        options:
          - full
          - dry
          - no-llm-dry

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build report
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE:               ${{ inputs.mode }}
        run: |
          case "$MODE" in
            no-llm-dry) FLAGS="--no-llm --dry-run" ;;
            dry)        FLAGS="--dry-run" ;;
            full)       FLAGS="" ;;
            *)          FLAGS="--once-daily" ;;
          esac
          echo "mode=${MODE:-scheduled} flags=$FLAGS at $(date -u +%H:%M) UTC"
          python src/main.py $FLAGS

      - name: Commit state
        if: always()
        run: |
          git config user.name  "sundeed-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Sundeed Watch failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
